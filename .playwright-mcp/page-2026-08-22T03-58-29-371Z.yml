        - heading "What ForgeHub is" [level=2] [ref=f16e108]
        - paragraph [ref=f16e109]: ForgeHub is a digital workspace for turning an idea into a finished, documented project. The same way GitHub tracks how code evolves, ForgeHub tracks how a build evolves — the research, the failed prototypes, the design decisions, the fixes. The journey is the product.
