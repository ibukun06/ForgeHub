        - paragraph [ref=f16e122]: The core loop
        - heading "Make the record while the work is still fresh." [level=2] [ref=f16e123]
        - paragraph [ref=f16e124]: ForgeHub is opinionated about what a technical project should leave behind, without pretending every team builds the same way.
      - generic [ref=f16e125]:
        - article [ref=f16e126]:
          - generic [ref=f16e127]: "01"
          - heading "Guided documentation" [level=3] [ref=f16e132]
          - paragraph [ref=f16e133]: Start with prompts for the problem, requirements, design, testing, and the decisions that connect them.
        - article [ref=f16e134]:
          - generic [ref=f16e135]: "02"
          - heading "AI-assisted drafting" [level=3] [ref=f16e140]
          - paragraph [ref=f16e141]: Turn your own notes into a useful first draft. Every AI output stays visibly draft until a human accepts it.
        - article [ref=f16e142]:
          - generic [ref=f16e143]: "03"
          - heading "Roles that make sense" [level=3] [ref=f16e150]
          - paragraph [ref=f16e151]: Give contributors editing access and advisors review access without turning permissions into guesswork.
        - article [ref=f16e152]:
          - generic [ref=f16e153]: "04"
          - heading "A living decisions log" [level=3] [ref=f16e158]
          - paragraph [ref=f16e159]: Capture what the team chose, what it considered, and why the choice made sense at the time.
        - article [ref=f16e160]:
          - generic [ref=f16e161]: "05"
          - heading "Evidence beside the record" [level=3] [ref=f16e165]
          - paragraph [ref=f16e166]: Attach sketches, research, images, and supporting files where the team will actually find them.
        - article [ref=f16e167]:
          - generic [ref=f16e168]: "06"
          - heading "A considered public snapshot" [level=3] [ref=f16e173]
          - paragraph [ref=f16e174]: Publish the sections you choose when the work is ready. Private project content never becomes public by accident.
